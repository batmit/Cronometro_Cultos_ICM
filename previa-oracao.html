<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cronômetro para Culto ICM</title>
    <style>
        :root {
            --vermelho-icm: #bb1626;
            --vermelho-escuro: #941220;
            --azul-escuro: #192a3d;
            --texto: #3a4f66;
            --fundo: #fff5f5;
            --borda: #ead7da;
            --branco: #ffffff;
        }
        * { box-sizing: border-box; }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(24px, 4vh, 48px);
            font-family: "Segoe UI", Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: clamp(24px, 4vh, 48px) 20px;
            border-top: 4px solid var(--vermelho-icm);
            background: #f7f8fa;
            min-height: 100vh;
            min-height: 100svh;
            color: var(--texto);
        }
        .cabecalho {
            width: 100%;
            max-width: 1040px;
            margin: 0 auto;
            padding: 0 12px;
        }
        .logo-igreja {
            display: block;
            width: 180px;
            max-width: 60%;
            height: auto;
            margin: 0 auto clamp(24px, 4vh, 44px);
        }
        h1 {
            margin: 0 0 12px;
            font-size: clamp(20px, 2.5vw, 30px);
            font-weight: 400;
            color: var(--azul-escuro);
        }
        #cronometro {
            font-size: clamp(48px, 12vw, 150px);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
            letter-spacing: -0.035em;
            color: var(--vermelho-icm);
        }
        .horario-culto {
            margin: 14px 0 0;
            font-size: clamp(16px, 1.8vw, 22px);
            color: var(--texto);
        }
        .painel-central {
            width: 100%;
            max-width: 1040px;
            margin: 0 auto;
            border: 1px solid #e5e8ed;
            border-radius: 8px;
            background: var(--branco);
            overflow: hidden;
        }
        .barra-titulo {
            margin: 0;
            padding: 12px 20px;
            background: var(--branco);
            color: var(--texto);
            font-size: 15px;
            font-weight: 600;
            overflow: hidden;
        }
        #tipo-conteudo {
            display: block;
            width: max-content;
            max-width: 100%;
            margin: 0 auto;
        }
        .painel-corpo { position: relative; }
        .seta-painel {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 48px;
            padding: 0;
            border: 1px solid #e5e8ed;
            border-radius: 8px;
            background: var(--branco);
            color: var(--texto);
            font-size: 32px;
            cursor: pointer;
        }
        #conteudo-anterior { left: 8px; }
        #proximo-conteudo { right: 8px; }
        .seta-painel:hover:not(:disabled) {
            background: var(--vermelho-icm);
            color: var(--branco);
        }
        .seta-painel:disabled { opacity: 0.35; cursor: default; }
        #conteudo-central {
            display: grid;
            align-items: center;
            min-height: 260px;
            height: clamp(260px, 32vh, 340px);
            overflow-y: auto;
            padding: 24px 72px;
        }
        .versiculo { margin: 0; }
        .mensagem-oracao {
            margin: 0;
            font-size: clamp(22px, 2.8vw, 34px);
            line-height: 1.4;
            color: var(--azul-escuro);
        }
        .versiculo p {
            margin: 0 0 18px;
            font-size: clamp(22px, 2.8vw, 34px);
            line-height: 1.4;
            overflow-wrap: break-word;
            color: var(--azul-escuro);
        }
        .versiculo strong {
            display: block;
            color: var(--vermelho-icm);
            font-size: 18px;
        }
        .noticia-link {
            display: block;
            text-align: left;
            color: var(--azul-escuro);
            text-decoration: none;
        }
        .noticia-com-imagem {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            align-items: center;
            gap: 24px;
        }
        .noticia-imagem {
            display: block;
            width: 100%;
            height: 210px;
            object-fit: contain;
            border-radius: 6px;
            background: var(--fundo);
        }
        .noticia-link time { color: var(--texto); font-size: 13px; }
        .noticia-link h3 {
            margin: 10px 0 18px;
            font-size: clamp(18px, 2.2vw, 24px);
            line-height: 1.4;
            overflow-wrap: anywhere;
        }
        .ler-noticia { color: var(--vermelho-icm); font-size: 14px; font-weight: 600; }
        .noticia-link:hover h3 { color: var(--vermelho-icm); }
        .painel-central a:focus-visible, .painel-central button:focus-visible {
            outline: 3px solid var(--vermelho-icm);
            outline-offset: 3px;
        }
        [hidden] { display: none !important; }
        @media (max-width: 600px) {
            body { padding: 24px 12px; }
            .cabecalho { padding: 0; }
            #conteudo-central { height: auto; min-height: 260px; }

            #conteudo-central { padding: 18px 58px; }
            #conteudo-anterior { left: 4px; }
            #proximo-conteudo { right: 4px; }
            .noticia-com-imagem { grid-template-columns: minmax(0, 1fr); gap: 14px; }
            .noticia-imagem { height: 180px; }
        }
    </style>
</head>
<body>
    <header class="cabecalho">
        <img class="logo-igreja" src="https://www.igrejacristamaranata.org.br/wp-content/uploads/2024/06/logo-icm.svg" alt="Igreja Cristã Maranata">
        <h1>Nosso culto começa em</h1>
        <div id="cronometro" role="timer" aria-label="Tempo para o início do culto">00:00:00</div>
        <p id="horario-culto" class="horario-culto"></p>
    </header>

    <section class="painel-central" aria-labelledby="tipo-conteudo">
        <h2 class="barra-titulo"><span id="tipo-conteudo">Palavra de Deus</span></h2>
        <div class="painel-corpo">
            <button id="conteudo-anterior" class="seta-painel" type="button" aria-label="Conteúdo anterior" aria-controls="conteudo-central" title="Conteúdo anterior" disabled>‹</button>
            <div id="conteudo-central" aria-live="polite" aria-atomic="true"></div>
            <button id="proximo-conteudo" class="seta-painel" type="button" aria-label="Próximo conteúdo" aria-controls="conteudo-central" title="Próximo conteúdo">›</button>
        </div>
    </section>

    <script src="versiculos.js"></script>
    <script src="painel.js"></script>
    <script>
        const duracaoCongelamento = 30 * 60 * 1000;
        const antecedenciaOracao = 5 * 60 * 1000;

        function obterDestino(agora) {
            // Inclui o dia anterior para preservar o congelamento ao atravessar a meia-noite.
            for (let deslocamento = -1; deslocamento <= 1; deslocamento++) {
                const dia = new Date(agora);
                dia.setDate(dia.getDate() + deslocamento);
                const horarios = dia.getDay() === 0 ? [[10, 0], [19, 0]]
                    : dia.getDay() === 6 ? [[19, 0]] : [[19, 30]];
                for (const [hora, minuto] of horarios) {
                    const destino = new Date(dia);
                    destino.setHours(hora, minuto, 0, 0);
                    if (agora.getTime() < destino.getTime() + duracaoCongelamento) {
                        return destino;
                    }
                }
            }
        }

        function atualizarCronometro() {
            const agora = new Date(2026, 9, 31, 18, 55, 28);
            const destino = obterDestino(agora);
            const horario = destino.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
            const outroDia = destino.toDateString() !== agora.toDateString();
            const dia = outroDia ? destino.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) + " às " : "às ";
            document.getElementById("horario-culto").textContent = "Início " + dia + horario;

            // Diferença em milissegundos
            const diferenca = destino - agora;
            atualizarMomentoDeOracao(diferenca <= antecedenciaOracao);

            if (diferenca <= 0) {
                document.getElementById("cronometro").textContent = "00:00:00";
                return;
            }

            // Converte a diferença
            const horas = Math.floor(diferenca / (1000 * 60 * 60));

            const minutos = Math.floor(
                (diferenca % (1000 * 60 * 60)) / (1000 * 60)
            );

            const segundos = Math.floor(
                (diferenca % (1000 * 60)) / 1000
            );

            // Exibe o resultado
            document.getElementById("cronometro").innerHTML =
                String(horas).padStart(2, '0') + ":" +
                String(minutos).padStart(2, '0') + ":" +
                String(segundos).padStart(2, '0');
        }

        // Atualiza a cada segundo
        setInterval(atualizarCronometro, 1000);

        // Executa imediatamente
        atualizarCronometro();
        </script>
</body>
</html>
